substitutions:
  name: clock2
  friendly_name: Clock 2
  # Room Light reading at which Auto Brightness reaches the Display light's
  # brightness. Anything brighter stays there.
  room_light_full: "75.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  # Called from Home Assistant automations as esphome.wifi_clock_<name>.
  # Temporary displays go back to the time on their own when the duration
  # runs out, so a failed automation cannot leave the clock showing stale data.
  actions:
    - action: show_seconds
      variables:
        duration: int
      then:
        - lambda: id(panel)->show_seconds(duration);
    # Right aligned digits with an optional unit in the rightmost position, so
    # 78F and -5C both read correctly. A unit of C or F also lights the degree
    # mark. Pass an empty unit to give the number all four positions. There is
    # no decimal point on the panel, so round before sending.
    - action: show_number
      variables:
        value: int
        unit: string
        duration: int
      then:
        - lambda: id(panel)->show_number(value, unit, duration);
    # Every populated LED, white, for a few seconds, then back to the time.
    # It ignores color, brightness and the light being off. Duration
    # is milliseconds, and 3000 is the button below.
    - action: lamp_test
      variables:
        duration: int
      then:
        - lambda: id(panel)->lamp_test(duration);

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # There is no RTC on this board, so a cold boot with no network means no
  # time at all. The panel shows four dashes until it has one.
  ap:
    ssid: ${friendly_name} Setup
    password: !secret ap_password
  # The panel drops the upper colon dot while the network is down, so the
  # clock tells you its time may be drifting without anyone opening an app.
  on_connect:
    - lambda: id(panel)->set_online(true);
  on_disconnect:
    - lambda: id(panel)->set_online(false);

captive_portal:

time:
  # No timezone on this one, deliberately. Home Assistant pushes its own
  # timezone to the device on every time sync, DST rules included, but only
  # if this platform has no timezone of its own. Setting one here compiles
  # that path out and pins the clock to whatever is written instead.
  - platform: homeassistant
    id: ha_time
  # SNTP is the fallback for a boot with no Home Assistant. It has nowhere to
  # learn a timezone from, so this one is spelled out. It is also what the
  # display shows for the first few seconds of every boot, until Home
  # Assistant answers. Change it if the clock moves.
  - platform: sntp
    id: sntp_time
    timezone: !secret timezone

aip33628:
  id: panel
  clk_pin: GPIO22    # MCU socket pin 14 (HU-058D) or 16 (HU-058/SE), driver 1
  data_pin: GPIO21   # MCU socket pin 5,  driver 1
  clk2_pin: GPIO19   # MCU socket pin 1,  driver 2
  data2_pin: GPIO18  # MCU socket pin 2,  driver 2
  time_id: ha_time
  # Power on defaults. The switches below own both after that, and they
  # restore their last state, so these only matter for a first ever boot.
  twelve_hour: true
  blink_colon: false
  # Ceiling on IS[3:0], 0 to 15. Fixed, never varied by content. The stock
  # firmware ran 0xF and drew 404mA doing it. Drop this if the drivers
  # run hotter than you want. See docs/display-map.md.
  max_current: 15

light:
  - platform: aip33628
    id: display
    aip33628_id: panel
    name: Display
    restore_mode: RESTORE_DEFAULT_ON
    # Gamma is applied inside the component, because it also has to allow for
    # the 2.5mA floor the drivers cannot go below. Leaving it on here as well
    # would square it.
    gamma_correct: 1.0

# Read the light level sensor
# Taken from the MrCeedJay fork:
sensor:
  - platform: adc
    pin: GPIO35
    id: light_sensor
    name: Room Light
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.0 -> 100.0
            - 3.1 -> 0.0
      - clamp:
          min_value: 0.0
          max_value: 100.0
    on_value:
      - lambda: id(panel)->set_room_level(x / ${room_light_full});

# The two front panel buttons. Nothing on the board pulls these nets up. The
# stock 8051 held them high with its own quasi-bidirectional port pullup, and
# that chip is out of the socket, so the ESP32 internal pullup is the only one
# and the lines never see 5V. Switch closed shorts to ground, hence inverted.
#
# No behavior is attached here on purpose. Home Assistant is the control
# surface, so these are just inputs it can bind to. Press and hold patterns
# belong in an automation, not in this file.
binary_sensor:
  - platform: gpio
    id: button_1
    name: Button 1
    pin:
      number: GPIO32  # MCU socket pin 9, net S1, top button on the case
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  - platform: gpio
    id: button_2
    name: Button 2
    pin:
      number: GPIO33  # MCU socket pin 10, net S2, bottom button on the case
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

script:
  - id: buzzer_beep
    mode: restart
    parameters:
      volume: float
    then:
      - output.turn_on: buzzer_output
      - output.ledc.set_frequency:
          id: buzzer_output
          frequency: !lambda "return id(buzzer_frequency).state;"
      - output.set_level:
          id: buzzer_output
          level: !lambda "return volume / 200.0f;"
      - delay: !lambda "return (uint32_t) id(buzzer_duration).state;"
      - output.turn_off: buzzer_output

  # Plays Alarm Steps beeps. Each is 25% louder than the last, timed so the
  # middle beep reaches Buzzer Volume, and the rest hold at that level. Buzzer
  # Volume itself is never changed. Started and stopped by the Alarm switch,
  # and turns that switch off when it finishes.
  - id: alarm_loop
    mode: single
    then:
      - repeat:
          count: !lambda "return (uint32_t) id(alarm_steps).state;"
          then:
            - script.execute:
                id: buzzer_beep
                volume: !lambda |-
                  const int middle = ((int) id(alarm_steps).state - 1) / 2;
                  float scale = std::min(powf(1.25f, (int) iteration - middle), 1.0f);
                  return id(buzzer_volume).state * scale;
            - delay: !lambda "return (uint32_t) id(buzzer_duration).state + 500;"
      # Publish rather than turn off, since there is nothing left to stop.
      - switch.template.publish:
          id: alarm_switch
          state: false

switch:
  - platform: template
    id: twelve_hour_mode
    name: 12 Hour Time
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(panel)->set_twelve_hour(true);
    turn_off_action:
      - lambda: id(panel)->set_twelve_hour(false);

  # Off means a steady colon, not a dark one.
  - platform: template
    id: colon_blink
    name: Blink Colon
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(panel)->set_blink_colon(true);
    turn_off_action:
      - lambda: id(panel)->set_blink_colon(false);

  # On, the Display light's brightness is the maximum, and the room light
  # scales the panel between 1% and that. Off, the panel follows the light.
  - platform: template
    id: auto_brightness
    name: Auto Brightness
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(panel)->set_auto_brightness(true);
    turn_off_action:
      - lambda: id(panel)->set_auto_brightness(false);

  # On starts the alarm, off stops it and silences the buzzer at once. Always
  # off after a reboot, so a restart can never set the alarm off.
  - platform: template
    id: alarm_switch
    name: Alarm
    icon: mdi:alarm-bell
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: alarm_loop
    turn_off_action:
      - script.stop: alarm_loop
      - script.stop: buzzer_beep
      - output.turn_off: buzzer_output

output:
  - platform: ledc
    pin: GPIO25
    id: buzzer_output
    frequency: 2000 Hz
    inverted: true

button:
  - platform: template
    name: Buzzer Beep
    icon: mdi:volume-high
    on_press:
      - script.execute:
          id: buzzer_beep
          volume: !lambda "return id(buzzer_volume).state;"

  # Three seconds of every populated LED lit white at half brightness, then
  # back to the time with the settings it had before.
  - platform: template
    name: Lamp Test
    on_press:
      - lambda: id(panel)->lamp_test(3000);

  # A shortcut for the common case, and something to press by hand.
  # Anything more elaborate belongs in a Home Assistant automation calling
  # the api actions above.
  - platform: template
    name: Show Seconds
    on_press:
      - lambda: id(panel)->show_seconds(5000);

number:

  - platform: template
    name: Buzzer Duration
    id: buzzer_duration
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 1
    max_value: 10000
    step: 1
    unit_of_measurement: ms
    mode: box

  - platform: template
    name: Buzzer Frequency
    id: buzzer_frequency
    optimistic: true
    restore_value: true
    initial_value: 2000
    min_value: 100
    max_value: 10000
    step: 1
    unit_of_measurement: Hz
    mode: box

  - platform: template
    name: Buzzer Volume
    id: buzzer_volume
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider

  - platform: template
    name: Alarm Steps
    id: alarm_steps
    icon: mdi:counter
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 1
    max_value: 100
    step: 1
    mode: box
